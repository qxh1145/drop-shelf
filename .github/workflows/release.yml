name: Release

# Push a tag that matches MARKETING_VERSION, e.g. `git tag v1.8.0 && git push origin v1.8.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches app version
        run: |
          VERSION=$(xcodebuild -project DropShelf.xcodeproj -scheme DropShelf -configuration Release -showBuildSettings \
            | awk '/ MARKETING_VERSION = / { print $3; exit }')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild \
            -project DropShelf.xcodeproj \
            -scheme DropShelf \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # No Developer ID yet: ad-hoc signing lets the app run on Apple silicon,
      # but Gatekeeper still warns on first launch.
      - name: Sign ad hoc
        run: codesign --force --deep --sign - build/Build/Products/Release/DropShelf.app

      - name: Create DMG
        run: |
          mkdir dmg
          cp -R build/Build/Products/Release/DropShelf.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname DropShelf -srcfolder dmg -ov -format UDZO "DropShelf-$VERSION.dmg"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "DropShelf-$VERSION.dmg" \
            --title "DropShelf $VERSION" \
            --generate-notes
